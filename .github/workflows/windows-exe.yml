name: Windows local executable

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows-local:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Publish native single executable
        shell: pwsh
        run: >
          dotnet publish windows/M365Mcp.Local/M365Mcp.Local.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output artifacts/windows-x64
          -p:TreatWarningsAsErrors=true
      - name: Verify single-file output
        id: artifact
        shell: pwsh
        run: |
          $publish = (Resolve-Path 'artifacts/windows-x64').Path
          $files = @(Get-ChildItem -LiteralPath $publish -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne 'm365-mcp.exe') {
            throw "Expected exactly one m365-mcp.exe output; found: $($files.Name -join ', ')"
          }
          [xml]$project = Get-Content 'windows/M365Mcp.Local/M365Mcp.Local.csproj'
          $projectVersion = $project.Project.PropertyGroup.Version
          & ./scripts/verify-windows-version-info.ps1 -Path $files[0].FullName -Edition NativeAOT -Version $projectVersion
          $hash = (Get-FileHash -LiteralPath $files[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          "Built m365-mcp.exe SHA-256 $hash"
      - name: Smoke test without runtime or extraction directory
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'artifacts/windows-x64/m365-mcp.exe').Path
          [xml]$project = Get-Content 'windows/M365Mcp.Local/M365Mcp.Local.csproj'
          $expectedVersion = $project.Project.PropertyGroup.Version
          $smokeRoot = Join-Path $env:RUNNER_TEMP "m365-local-smoke"
          New-Item -ItemType Directory -Path $smokeRoot -Force | Out-Null
          $env:TEMP = $smokeRoot
          $env:TMP = $smokeRoot
          $env:LOCALAPPDATA = Join-Path $smokeRoot 'local'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"

          $version = & $exe --version
          if ($LASTEXITCODE -ne 0 -or $version -ne "m365-mcp $expectedVersion") {
            throw "Version option failed: $version"
          }

          $doctor = & $exe doctor --ephemeral | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $doctor.ok -or -not $doctor.ephemeral) {
            throw 'Ephemeral doctor check failed.'
          }
          if (
            -not $doctor.client_id_configured `
            -or $doctor.client_id -ne '6e35216e-2623-43cc-b867-83bec0865cf3' `
            -or $doctor.client_id_source -ne 'built_in'
          ) {
            throw 'Built-in Windows client ID was not selected by default.'
          }

          $env:M365_LOCAL_CLIENT_ID = '11111111-1111-1111-1111-111111111111'
          $overrideDoctor = & $exe doctor --ephemeral | ConvertFrom-Json
          if (
            $LASTEXITCODE -ne 0 `
            -or -not $overrideDoctor.ok `
            -or $overrideDoctor.client_id -ne '11111111-1111-1111-1111-111111111111' `
            -or $overrideDoctor.client_id_source -ne 'environment'
          ) {
            throw 'M365_LOCAL_CLIENT_ID did not override the built-in client ID.'
          }
          Remove-Item Env:M365_LOCAL_CLIENT_ID

          $requests = @(
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}',
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}',
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":42,"arguments":{}}}',
            '{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"mail_mark_read","arguments":{"message_id":"test","is_read":"true"}}}',
            '{"jsonrpc":"2.0","id":5,"method":"tools/call","params":{"name":"mail_add_draft_attachment","arguments":{}}}',
            '{"jsonrpc":"2.0","id":6,"method":"ping","params":{}}'
          )
          $responses = @($requests | & $exe stdio --ephemeral)
          if ($LASTEXITCODE -ne 0 -or $responses.Count -ne 6) {
            throw "stdio smoke test failed with $($responses.Count) responses."
          }
          $initialize = $responses[0] | ConvertFrom-Json
          $tools = $responses[1] | ConvertFrom-Json
          $invalidName = $responses[2] | ConvertFrom-Json
          $invalidBoolean = $responses[3] | ConvertFrom-Json
          $invalidAttachment = $responses[4] | ConvertFrom-Json
          $ping = $responses[5] | ConvertFrom-Json
          if ($initialize.result.serverInfo.name -ne 'M365 MCP Server (Windows Local)') {
            throw 'Unexpected MCP server identity.'
          }
          if (@($tools.result.tools).Count -ne 11) {
            throw "Expected 11 local mail tools; found $(@($tools.result.tools).Count)."
          }
          if (-not $invalidName.result.isError -or -not $invalidBoolean.result.isError -or -not $invalidAttachment.result.isError) {
            throw 'Invalid tool argument handling failed.'
          }
          if ($ping.id -ne 6 -or $null -eq $ping.result) {
            throw 'stdio server did not continue after invalid tool arguments.'
          }

          $attachmentRoot = Join-Path $smokeRoot 'attachments'
          New-Item -ItemType Directory -Path $attachmentRoot | Out-Null
          $artifact = Join-Path $attachmentRoot 'report.zip'
          [System.IO.File]::WriteAllBytes($artifact, [byte[]](1, 2, 3, 4))
          $env:M365_ATTACHMENT_ROOT = $attachmentRoot
          $env:M365_ATTACHMENT_PUSH_URL = 'https://mcp.example.com/uploads/push'
          $PSNativeCommandUseErrorActionPreference = $false
          $inspection = & $exe inspect-attachment 'report.zip' 2>&1
          $inspectionExit = $LASTEXITCODE
          if ($inspectionExit -ne 0) {
            throw "Attachment inspection exited $inspectionExit`: $inspection"
          }
          $inspected = $inspection | ConvertFrom-Json
          if (
            $LASTEXITCODE -ne 0 `
            -or $inspected.name -ne 'report.zip' `
            -or $inspected.content_length -ne 4 `
            -or $inspected.content_sha256 -ne '9f64a747e1b97f131fabb6b447296c9b6f0201e79fb3c5356e6c77e89b6a806a'
          ) {
            throw 'Bounded attachment inspection failed.'
          }
          Remove-Item Env:M365_ATTACHMENT_PUSH_URL
          $attachmentRequests = @(
            '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}',
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"mail_add_draft_attachment","arguments":{"draft_id":"draft-1","relative_path":"..\\outside.zip"}}}',
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"mail_add_draft_attachment","arguments":{"draft_id":"draft-1","relative_path":"report.zip","content_type":"application/pdf"}}}',
            '{"jsonrpc":"2.0","id":4,"method":"ping","params":{}}'
          )
          $attachmentResponses = @($attachmentRequests | & $exe stdio --ephemeral)
          if ($LASTEXITCODE -ne 0 -or $attachmentResponses.Count -ne 4) {
            throw 'Automated stdio attachment smoke test failed.'
          }
          $attachmentTools = $attachmentResponses[0] | ConvertFrom-Json
          $pathRejected = $attachmentResponses[1] | ConvertFrom-Json
          $typeRejected = $attachmentResponses[2] | ConvertFrom-Json
          $afterRejection = $attachmentResponses[3] | ConvertFrom-Json
          $attachmentTool = @($attachmentTools.result.tools | Where-Object name -eq 'mail_add_draft_attachment')[0]
          if (
            -not $attachmentTool.inputSchema.properties.relative_path `
            -or -not $pathRejected.result.isError `
            -or -not $typeRejected.result.isError `
            -or $typeRejected.result.content[0].text -notmatch 'content_type must match' `
            -or $afterRejection.id -ne 4
          ) {
            throw 'Automated stdio attachment validation failed.'
          }
          $env:M365_ATTACHMENT_PUSH_URL = 'https://mcp.example.com/uploads/push'
          $escaped = & $exe inspect-attachment '..\outside.zip' 2>&1
          $escapedExit = $LASTEXITCODE
          if ($escapedExit -eq 0 -or $escaped -match '9f64a747') {
            throw 'Attachment root traversal was not rejected.'
          }
          $global:LASTEXITCODE = 0
          Remove-Item -LiteralPath $artifact
          Remove-Item -LiteralPath $attachmentRoot
          Remove-Item Env:M365_ATTACHMENT_ROOT
          Remove-Item Env:M365_ATTACHMENT_PUSH_URL

          $unexpected = @(Get-ChildItem -LiteralPath $smokeRoot -Recurse -File -ErrorAction SilentlyContinue)
          if ($unexpected.Count -ne 0) {
            throw "Ephemeral runtime created undeclared files: $($unexpected.FullName -join ', ')"
          }
      - name: Upload Windows executable
        uses: actions/upload-artifact@v7.0.2
        with:
          name: m365-mcp-windows-x64
          path: artifacts/windows-x64/m365-mcp.exe
          if-no-files-found: error
          retention-days: 14
